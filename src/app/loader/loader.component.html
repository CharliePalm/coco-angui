<div
  class="fixed inset-0 flex items-center justify-center duration-500 perspective-distant transform-3d"
  *ngIf="!done"
>
  <img
    class="max-w-64"
    [ngClass]="{ pulse: loading, 'throw-it-back': !loading }"
    src="../../assets/logo transparent.png"
    (animationend)="onAnimationDone()"
  />
</div>
