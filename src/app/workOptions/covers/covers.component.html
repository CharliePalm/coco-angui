<app-work-scroller [upOption]="upOption" [downOption]="downOption"></app-work-scroller>
<div class="w-sreen h-screen overflow-visible">
  <div class="absolute top-0 left-0 w-screen h-screen z-0">
    <div class="flex flex-col items-center w-full h-full text-6xl mt-20 z-40">
      Covers
    </div>
    <ng-container *ngFor="let image of images; let i = index">
      <img
        [src]="'../../../assets/covers/' + image"
        [style.--tw-translate-x]="imageStyle[i][1] ? imageStyle[i][2].x : '0'"
        [style.--tw-translate-y]="imageStyle[i][1] ? imageStyle[i][2].y : '0'"
        [style.top]="imageStyle[i][0].top"
        [style.left]="imageStyle[i][0].left"
        [style.--tw-rotate]="imageStyle[i][1] ? '0' : imageStyle[i][0].rotate"
        [style.--tw-scale-x]="imageStyle[i][1] ? '3' : '1'"
        [style.--tw-scale-y]="imageStyle[i][1] ? '3' : '1'"
        [style.z-index]="imageStyle[i][1] ? 40 : imageStyle[i][0]['z-index']"
        (click)="focus(i)"
        class="absolute transform transition-transform hover:cursor-pointer hover:translate-z-10 duration-200 max-w-[100px] md:max-w-[150px] lg:max-w-[300px] rounded-md shadow-lg"
      />
    </ng-container>
  </div>
</div>
