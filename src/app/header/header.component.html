<div
  class="bg-monizzie-red text-monizzie-white fixed z-20 grid h-16 w-full grid-cols-3 text-center text-2xl md:text-4xl lg:text-5xl"
>
  <div class="group flex items-center justify-center">
    <div class="flex items-baseline justify-baseline">
      <span (click)="toggle()" class="block h-full md:hidden" #workButton
        >Work
      </span>
      <span class="hidden cursor-default group-hover:underline md:block"
        >Work</span
      >
      <span
        class="text-monizzie-white h-full overflow-hidden pl-2 text-sm opacity-80 sm:text-sm md:pl-4 md:text-lg"
        *ngIf="selectedOption"
      >
        -> {{ selectedOption }}</span
      >
    </div>
    <div
      class="text-monizzie-red text-shadow-monizzie-white druation-300 absolute top-16 z-0 flex -translate-y-80 flex-col items-center justify-center text-3xl opacity-0 transition-opacity text-shadow-md group-hover:opacity-100 sm:hover:translate-y-0"
      [ngClass]="{
        'translate-y-0 opacity-100': dropdown,
        '-translate-y-80!': forceClose,
        'group-hover:translate-y-0': !forceClose,
      }"
    >
      <div
        *ngFor="let option of sortedOptions"
        class="scale-110 cursor-pointer text-2xl hover:scale-125"
        (click)="optionClicked(option)"
      >
        {{ option }}
      </div>
    </div>
  </div>
  <div
    class="flex items-center justify-center hover:cursor-pointer hover:underline"
    routerLink=""
  >
    Home
  </div>
  <div
    class="flex items-center justify-center hover:cursor-pointer hover:underline"
    routerLink="about"
  >
    About
  </div>
</div>
