<div
  class="bg-monizzie-red text-monizzie-white fixed z-20 grid h-16 w-full grid-cols-3 text-center text-2xl md:text-4xl lg:text-5xl"
>
  <div class="group flex items-center justify-center">
    <div (click)="toggle()">Work</div>
    <div
      class="text-monizzie-red druation-300 absolute top-16 z-0 flex -translate-y-80 flex-col items-center justify-center text-3xl opacity-0 transition-opacity group-hover:translate-y-0 group-hover:opacity-100 sm:hover:translate-y-0"
      [ngClass]="{
        'translate-y-0 opacity-100': dropdown,
      }"
    >
      <div
        *ngFor="let option of options"
        class="scale-110 cursor-pointer text-2xl hover:scale-125"
        (click)="dropdown = false; router.navigate([option])"
      >
        {{ option }}
      </div>
    </div>
  </div>
  <div
    class="flex items-center justify-center hover:cursor-pointer hover:underline"
    routerLink=""
  >
    Home
  </div>
  <div
    class="flex items-center justify-center hover:cursor-pointer hover:underline"
    routerLink="about"
  >
    About
  </div>
</div>
